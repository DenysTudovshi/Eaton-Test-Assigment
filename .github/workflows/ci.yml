name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release

  # Pull requests build both images to prove the Dockerfiles still work; pushes to
  # main additionally publish them to GHCR, tagged latest plus the immutable commit SHA.
  docker-images:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Console image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/denystudovshi/item-finder:latest
            ghcr.io/denystudovshi/item-finder:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DenysTudovshi/Eaton-Test-Assigment
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/denystudovshi/item-finder-api:latest
            ghcr.io/denystudovshi/item-finder-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DenysTudovshi/Eaton-Test-Assigment
